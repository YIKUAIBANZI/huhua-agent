<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>胡话简历 · 简历编辑</title>
  <link rel="stylesheet" href="/static/resume-editor.css">
  <script src="/static/resume-editor.js" defer></script>
</head>
<body>
  <header id="header">
    <span>胡话简历 <span class="header-divider">/</span> 简历编辑</span>
    <div id="header-actions">
      <button id="btn-mobile-preview" class="mobile-mode active" type="button">看预览</button>
      <button id="btn-mobile-edit" class="mobile-mode" type="button">改内容</button>
      <button id="btn-toggle-data" type="button" aria-expanded="true">收起编辑</button>
      <a href="/">回到聊天</a>
    </div>
  </header>

  <main id="resume-main" class="show-data">
    <aside class="panel" id="template-panel" aria-label="选择简历模板">
      <div class="panel-header">模板 <span class="muted" id="tpl-count"></span></div>
      <nav id="template-list"></nav>
    </aside>

    <section class="panel" id="preview-panel" aria-label="简历预览">
      <div class="panel-header">
        <div class="preview-heading">预览 <span class="muted" id="current-tpl"></span></div>
        <span id="render-status" role="status" aria-live="polite">正在加载</span>
        <div id="export-wrap">
          <button id="btn-export" type="button" aria-expanded="false">导出 ▾</button>
          <div id="export-menu" hidden>
            <button class="export-opt" data-format="pdf" type="button">导出 PDF</button>
            <button class="export-opt" data-format="docx" type="button">通用 Word</button>
            <p class="export-note">所选模板用于 PDF；Word 使用统一排版。</p>
          </div>
        </div>
      </div>
      <div id="preview-scroll"><div id="preview-page"><iframe id="preview-frame" title="简历预览，点击文字可定位编辑" sandbox="allow-scripts"></iframe></div></div>
      <p id="preview-hint">悬停查看对应字段，点击文字定位编辑</p>
    </section>

    <section class="panel" id="data-panel" aria-label="编辑简历内容">
      <div class="panel-header">
        <div>编辑内容 <span class="muted" id="data-source"></span></div>
        <button id="btn-upload-photo" class="secondary-button" type="button">上传头像</button>
        <input id="photo-input" type="file" accept="image/jpeg,image/png" hidden>
      </div>
      <p class="editor-note">修改后预览自动更新，导出使用当前内容。悬停文字可找到对应输入框。</p>
      <div id="form-editor"></div>
    </section>
  </main>
</body>
</html>
