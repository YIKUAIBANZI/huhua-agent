services:
  - type: web
    name: huhua-agent
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /healthz
    envVars:
      - key: LLM_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: huhua-agent-db
          property: connectionString
      - key: LLM_BASE_URL
        value: https://dashscope.aliyuncs.com/compatible-mode/v1
      - key: LLM_MODEL
        value: qwen-plus
      - key: LLM_STRUCTURED_MODEL
        value: qwen-plus

databases:
  - name: huhua-agent-db
    plan: free
    region: singapore
